<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Breaker · Brick-smashing arcade</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="app">
    <a class="back-link" href="../index.html" aria-label="Back to Arcade">← Arcade</a>

    <header class="head">
      <h1 class="title">Neon<span>Breaker</span></h1>
      <p class="subtitle">Smash every glowing brick — move with mouse, touch or ← →</p>
    </header>

    <!-- ===== HUD ===== -->
    <div class="hud">
      <div class="stat">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Lives</span>
        <span class="stat-value" id="lives">3</span>
      </div>
      <div class="stat">
        <span class="stat-label">Level</span>
        <span class="stat-value" id="level">1</span>
      </div>
      <div class="stat">
        <span class="stat-label">Best</span>
        <span class="stat-value" id="best">0</span>
      </div>
    </div>

    <!-- ===== Play field (la región flexible centra y dimensiona el lienzo) ===== -->
    <div class="stage-region" id="stageRegion">
      <div class="stage-wrap" id="stageWrap">
        <canvas class="stage" id="stage" aria-label="Neon Breaker play field" role="img"></canvas>
        <canvas class="fx" id="fx" aria-hidden="true"></canvas>

        <!-- Overlay genérico (start / level clear / game over / win) -->
        <div class="overlay" id="overlay" hidden>
          <div class="overlay-card">
            <div class="overlay-icon" id="ovIcon" aria-hidden="true"></div>
            <h2 class="overlay-title" id="ovTitle">Neon Breaker</h2>
            <p class="overlay-text" id="ovText">—</p>
            <div class="overlay-actions">
              <button class="btn btn-ghost" id="ovSecondary" hidden>Menu</button>
              <button class="btn btn-primary" id="ovPrimary">Play</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== Controles ===== -->
    <section class="controls">
      <button class="icon-btn" id="soundToggle" aria-label="Toggle sound" title="Sound"></button>
      <button class="btn btn-ghost" id="pauseBtn">Pause</button>
      <button class="btn btn-ghost" id="restartBtn">Restart</button>
    </section>

    <p class="legend" aria-hidden="true">
      <span><svg width="14" height="14" viewBox="0 0 24 24" fill="#22d3ee"><circle cx="12" cy="7" r="3"/><circle cx="7" cy="16" r="3"/><circle cx="17" cy="16" r="3"/></svg> Multiball</span>
      <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><polyline points="7,8 3,12 7,16"/><polyline points="17,8 21,12 17,16"/></svg> Wide</span>
      <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"><path d="M3 12 Q7.5 4 12 12 T21 12"/></svg> Slow</span>
      <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f472b6" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Life</span>
      <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fb7185" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="5"/><polyline points="6,11 12,5 18,11"/></svg> Laser</span>
      <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"><path d="M5 11 a7 7 0 0 0 14 0"/><circle cx="12" cy="7" r="2.4" fill="#38bdf8" stroke="none"/></svg> Catch</span>
      <span><svg width="14" height="14" viewBox="0 0 24 24" fill="#fb923c"><path d="M12 3 Q19 11 14 18 Q12 20.5 10 18 Q5 11 12 3 Z"/></svg> Pierce</span>
      <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3 L19 6 V11 Q19 17 12 21 Q5 17 5 11 V6 Z"/></svg> Shield</span>
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
