<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sliding Puzzle · Smart sliding</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <main class="app">
    <a class="back-link" href="../index.html" aria-label="Back to Arcade">← Arcade</a>
    <header class="head">
      <h1 class="title">Sliding<span>Puzzle</span></h1>
      <p class="subtitle">Slide a tile — or a whole row/column in one tap</p>
    </header>

    <!-- ===== Start menu: choose grid, then play ===== -->
    <section class="menu" id="menu">
      <h2 class="menu-title">Choose your board</h2>
      <div class="menu-sizes" role="group" aria-label="Board size">
        <button class="size-card" data-size="3">
          <span class="size-dim">3 × 3</span>
          <span class="size-tag">Easy</span>
        </button>
        <button class="size-card is-active" data-size="4">
          <span class="size-dim">4 × 4</span>
          <span class="size-tag">Classic</span>
        </button>
        <button class="size-card" data-size="5">
          <span class="size-dim">5 × 5</span>
          <span class="size-tag">Hard</span>
        </button>
      </div>
      <button class="btn btn-primary btn-lg" id="startBtn">Start</button>
    </section>

    <!-- ===== Game view ===== -->
    <section class="game" id="game" hidden>
      <div class="hud">
        <div class="stat">
          <span class="stat-label">Moves</span>
          <span class="stat-value" id="moves">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Time</span>
          <span class="stat-value" id="time">0:00</span>
        </div>
        <div class="stat">
          <span class="stat-label">Best</span>
          <span class="stat-value" id="best">—</span>
        </div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board"></div>
        <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
        <div class="win-overlay" id="winOverlay" hidden>
          <div class="win-card">
            <div class="win-emoji" id="winEmoji">🎉</div>
            <div class="win-stars" id="winStars" aria-hidden="true"></div>
            <h2 id="winTitle">Solved!</h2>
            <p id="winStats">—</p>
            <div class="win-actions">
              <button class="btn btn-ghost" id="winMenu">Change size</button>
              <button class="btn btn-primary" id="winPlayAgain">Play again</button>
            </div>
          </div>
        </div>
      </div>

      <section class="controls">
        <button class="icon-btn" id="soundToggle" aria-label="Toggle sound" title="Sound">🔊</button>
        <button class="btn btn-ghost" id="solve">Solve</button>
        <button class="btn btn-ghost" id="shuffle">Shuffle</button>
      </section>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
