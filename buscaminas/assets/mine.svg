<?xml version="1.0" encoding="UTF-8"?>
<!-- Mina naval: círculo con púas -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Mine">
  <defs>
    <radialGradient id="mine-body" cx="0.38" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#5b6478"/>
      <stop offset="0.6" stop-color="#2c3240"/>
      <stop offset="1" stop-color="#171b25"/>
    </radialGradient>
  </defs>
  <!-- Púas -->
  <g fill="#3a4150">
    <rect x="29.5" y="6" width="5" height="12" rx="2"/>
    <rect x="29.5" y="46" width="5" height="12" rx="2"/>
    <rect x="6" y="29.5" width="12" height="5" rx="2"/>
    <rect x="46" y="29.5" width="12" height="5" rx="2"/>
    <rect x="12" y="13" width="5" height="11" rx="2" transform="rotate(-45 14.5 18.5)"/>
    <rect x="47" y="13" width="5" height="11" rx="2" transform="rotate(45 49.5 18.5)"/>
    <rect x="12" y="40" width="5" height="11" rx="2" transform="rotate(45 14.5 45.5)"/>
    <rect x="47" y="40" width="5" height="11" rx="2" transform="rotate(-45 49.5 45.5)"/>
  </g>
  <!-- Puntas de las púas (acento rojo) -->
  <g fill="#ff4d4d">
    <circle cx="32" cy="8" r="3"/>
    <circle cx="32" cy="56" r="3"/>
    <circle cx="8" cy="32" r="3"/>
    <circle cx="56" cy="32" r="3"/>
  </g>
  <!-- Cuerpo -->
  <circle cx="32" cy="32" r="18" fill="url(#mine-body)" stroke="#0b1020" stroke-width="1.5"/>
  <!-- Punto de luz -->
  <circle cx="26" cy="26" r="4" fill="#aab4cc" opacity="0.85"/>
</svg>
