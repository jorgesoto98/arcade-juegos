  <!-- Anillo delantero -->
  <ellipse cx="64" cy="64" rx="62" ry="17" fill="none" stroke="#f3dcb4" stroke-width="3.5" stroke-opacity="0.85" transform="rotate(-18 64 64)" stroke-dasharray="0 100 120 220"/>
