<?xml version="1.0" encoding="UTF-8"?>
<!-- Big Merge · nivel 6: gigante gaseoso -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Gas giant">
  <defs>
