      <stop offset="0.82" stop-color="#ffcf8a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e0a55c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gg-body" cx="44" cy="40" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6d9a8"/>
      <stop offset="0.7" stop-color="#d99c5b"/>
      <stop offset="1" stop-color="#9c6432"/>
    </radialGradient>
    <clipPath id="gg-clip"><circle cx="64" cy="64" r="54"/></clipPath>
