    <rect x="8" y="26" width="112" height="12" fill="#c98c4e" opacity="0.7"/>
    <rect x="8" y="44" width="112" height="9" fill="#b87a3c" opacity="0.7"/>
    <rect x="8" y="60" width="112" height="13" fill="#e8b878" opacity="0.6"/>
    <rect x="8" y="80" width="112" height="10" fill="#b87a3c" opacity="0.7"/>
    <rect x="8" y="96" width="112" height="9" fill="#c98c4e" opacity="0.6"/>
    <!-- Gran mancha -->
    <ellipse cx="84" cy="78" rx="14" ry="9" fill="#d35f3a"/>
    <ellipse cx="84" cy="78" rx="8" ry="4.5" fill="#f0855e"/>
