<?xml version="1.0" encoding="UTF-8"?>
<!-- Big Merge · nivel 9: supernova -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Supernova">
  <defs>
    <radialGradient id="sn-glow" cx="64" cy="64" r="64" gradientUnits="userSpaceOnUse">
      <stop offset="0.2" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#7fd8ff" stop-opacity="0.5"/>
      <stop offset="0.74" stop-color="#b46bff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sn-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#bff0ff"/>
      <stop offset="1" stop-color="#7fd8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#sn-glow)"/>
  <!-- Rayos cardinales largos -->
  <g fill="#ffe9ff" opacity="0.9">
    <polygon points="64,2 71,60 57,60"/>
    <polygon points="64,126 71,68 57,68"/>
    <polygon points="2,64 60,57 60,71"/>
    <polygon points="126,64 68,57 68,71"/>
  </g>
  <!-- Rayos diagonales -->
  <g fill="#ffc8f5" opacity="0.8" transform="rotate(45 64 64)">
    <polygon points="64,14 70,60 58,60"/>
    <polygon points="64,114 70,68 58,68"/>
    <polygon points="14,64 60,58 60,70"/>
    <polygon points="114,64 68,58 68,70"/>
  </g>
  <circle cx="64" cy="64" r="34" fill="url(#sn-core)"/>
  <circle cx="64" cy="64" r="15" fill="#ffffff"/>
</svg>
