<?xml version="1.0" encoding="UTF-8"?>
<!-- Big Merge · nivel 10: agujero negro -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Black hole">
  <defs>
    <radialGradient id="bh-glow" cx="64" cy="64" r="64" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="0.85" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bh-disk" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#ffd23d"/>
      <stop offset="1" stop-color="#ff5d3d"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#bh-glow)"/>
  <!-- Disco de acreción visto casi de canto -->
  <ellipse cx="64" cy="64" rx="58" ry="22" fill="none" stroke="url(#bh-disk)" stroke-width="10" transform="rotate(-20 64 64)" opacity="0.95"/>
  <ellipse cx="64" cy="64" rx="58" ry="22" fill="none" stroke="#fff1c0" stroke-width="2.5" transform="rotate(-20 64 64)" opacity="0.4"/>
  <!-- Horizonte de sucesos -->
  <circle cx="64" cy="64" r="34" fill="#05070f"/>
  <!-- Anillo de fotones -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="#fff1c0" stroke-width="3" opacity="0.95"/>
  <circle cx="64" cy="64" r="38" fill="none" stroke="#ffd23d" stroke-width="2" opacity="0.5"/>
</svg>
