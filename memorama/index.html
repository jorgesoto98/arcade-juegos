<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Memorama · Match the pairs</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="app">
    <a class="back-link" href="../index.html" aria-label="Back to Arcade">← Arcade</a>
    <header class="head">
      <h1 class="title">Memo<span>rama</span></h1>
      <p class="subtitle">Flip the cards and match every pair</p>
    </header>

    <!-- ===== Start menu: elegir dificultad, luego jugar ===== -->
    <section class="menu" id="menu">
      <h2 class="menu-title">Choose your difficulty</h2>
      <div class="menu-sizes" role="group" aria-label="Difficulty">
        <button class="size-card" data-diff="easy" type="button">
          <span class="size-dim">4 pairs</span>
          <span class="size-tag">Easy</span>
        </button>
        <button class="size-card is-active" data-diff="classic" type="button">
          <span class="size-dim">8 pairs</span>
          <span class="size-tag">Classic</span>
        </button>
      </div>

      <!-- Modo Pulso: revela todas las cartas 2s para memorizar y luego las oculta -->
      <div class="menu-options">
        <button class="switch" id="pulseToggle" type="button" role="switch" aria-checked="false">
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          <span class="switch-info">
            <span class="switch-name">Pulse mode</span>
            <span class="switch-desc">Peek at every card for 2s, then memorize</span>
          </span>
        </button>
      </div>

      <button class="btn btn-primary btn-lg" id="startBtn" type="button">Start</button>
    </section>

    <!-- ===== Game view ===== -->
    <section class="game" id="game" hidden>
      <div class="hud">
        <div class="stat">
          <span class="stat-label">Tries</span>
          <span class="stat-value" id="tries">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Time</span>
          <span class="stat-value" id="time">0:00</span>
        </div>
        <div class="stat">
          <span class="stat-label">Best</span>
          <span class="stat-value" id="best">—</span>
        </div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" aria-label="Memory board"></div>
        <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
        <div class="win-overlay" id="winOverlay" role="status" aria-live="polite" hidden>
          <div class="win-card">
            <div class="win-emoji" id="winEmoji">🎉</div>
            <div class="win-stars" id="winStars" aria-hidden="true"></div>
            <h2 id="winTitle">You win!</h2>
            <p id="winStats">—</p>
            <div class="win-actions">
              <button class="btn btn-ghost" id="winMenu" type="button">Change difficulty</button>
              <button class="btn btn-primary" id="winPlayAgain" type="button">Play again</button>
            </div>
          </div>
        </div>
      </div>

      <section class="controls">
        <button class="icon-btn" id="soundToggle" type="button" aria-label="Toggle sound" title="Sound">🔊</button>
        <button class="btn btn-ghost" id="menuBtn" type="button">Change difficulty</button>
        <button class="btn btn-ghost" id="restart" type="button">Restart</button>
      </section>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
