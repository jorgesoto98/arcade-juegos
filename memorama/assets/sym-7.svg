<?xml version="1.0" encoding="UTF-8"?>
<!-- Símbolo 7: gema / diamante -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Gem">
  <defs>
    <linearGradient id="gem-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Corona superior -->
  <polygon points="20,12 44,12 56,26 8,26" fill="url(#gem-fill)" stroke="#0e7490" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Cuerpo inferior -->
  <polygon points="8,26 56,26 32,56" fill="#22d3ee" stroke="#0e7490" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Facetas -->
  <polygon points="20,12 26,26 8,26" fill="#a6fbff" opacity="0.7"/>
  <polygon points="44,12 38,26 56,26" fill="#a6fbff" opacity="0.7"/>
  <polyline points="8,26 32,56 56,26" fill="none" stroke="#bdfaff" stroke-width="1.4" opacity="0.8"/>
  <line x1="26" y1="26" x2="32" y2="56" stroke="#0e7490" stroke-width="1.2" opacity="0.6"/>
  <line x1="38" y1="26" x2="32" y2="56" stroke="#0e7490" stroke-width="1.2" opacity="0.6"/>
</svg>
