<?xml version="1.0" encoding="UTF-8"?>
<!-- Reverso de carta: degradado de acentos con patrón arcade -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Card back">
  <defs>
    <linearGradient id="back-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="back-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="52" height="52" rx="12" fill="url(#back-grad)"/>
  <rect x="6" y="6" width="52" height="52" rx="12" fill="url(#back-shine)"/>
  <!-- Marco interior -->
  <rect x="12" y="12" width="40" height="40" rx="8" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.55"/>
  <!-- Rombo central -->
  <polygon points="32,18 46,32 32,46 18,32" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.85"/>
  <circle cx="32" cy="32" r="5" fill="#0b1020" fill-opacity="0.25" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.8"/>
  <!-- Puntos en esquinas -->
  <circle cx="32" cy="14" r="1.6" fill="#ffffff" fill-opacity="0.8"/>
  <circle cx="32" cy="50" r="1.6" fill="#ffffff" fill-opacity="0.8"/>
  <circle cx="14" cy="32" r="1.6" fill="#ffffff" fill-opacity="0.8"/>
  <circle cx="50" cy="32" r="1.6" fill="#ffffff" fill-opacity="0.8"/>
</svg>
