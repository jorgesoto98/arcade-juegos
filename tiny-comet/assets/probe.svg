<?xml version="1.0" encoding="UTF-8"?>
<!-- Tiny Comet: sonda / gancho espacial con cable -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Space probe">
  <defs>
    <radialGradient id="pr-glow" cx="64" cy="70" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pr-metal" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#aeb8cc"/>
      <stop offset="0.45" stop-color="#eef2ff"/>
      <stop offset="0.55" stop-color="#cfd6e8"/>
      <stop offset="1" stop-color="#7c879e"/>
    </linearGradient>
    <radialGradient id="pr-lens" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#bff7ff"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="70" r="60" fill="url(#pr-glow)"/>
  <!-- Cable -->
  <line x1="64" y1="4" x2="64" y2="34" stroke="#8a93aa" stroke-width="3"/>
  <line x1="64" y1="4" x2="64" y2="34" stroke="#d7ddec" stroke-width="1" opacity="0.7"/>
  <circle cx="64" cy="34" r="5" fill="#7c879e" stroke="#5b6478" stroke-width="1.5"/>
  <!-- Cuerpo metálico de la sonda -->
  <path d="M44 40 H84 a8 8 0 0 1 8 8 V74 a28 28 0 0 1 -56 0 V48 a8 8 0 0 1 8 -8 Z"
        fill="url(#pr-metal)" stroke="#5b6478" stroke-width="2"/>
  <!-- Lente / sensor cian -->
  <circle cx="64" cy="60" r="15" fill="url(#pr-lens)" stroke="#0e7490" stroke-width="2"/>
  <circle cx="58" cy="54" r="4" fill="#ffffff" opacity="0.8"/>
  <!-- Pinzas / gancho -->
  <path d="M48 92 C40 100 38 110 44 118" fill="none" stroke="#9aa3ba" stroke-width="6" stroke-linecap="round"/>
  <path d="M80 92 C88 100 90 110 84 118" fill="none" stroke="#9aa3ba" stroke-width="6" stroke-linecap="round"/>
  <path d="M48 92 C40 100 38 110 44 118" fill="none" stroke="#e6ebf7" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M80 92 C88 100 90 110 84 118" fill="none" stroke="#e6ebf7" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
