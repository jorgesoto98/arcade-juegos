<?xml version="1.0" encoding="UTF-8"?>
<!-- Tiny Comet: fragmento / cristal estelar brillante -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Star fragment">
  <defs>
    <radialGradient id="fr-glow" cx="64" cy="64" r="64" gradientUnits="userSpaceOnUse">
      <stop offset="0.4" stop-color="#bff7ff" stop-opacity="0.7"/>
      <stop offset="0.72" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fr-face-a" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#eafdff"/>
      <stop offset="1" stop-color="#5fe6ff"/>
    </linearGradient>
    <linearGradient id="fr-face-b" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#5fe6ff"/>
      <stop offset="1" stop-color="#1b9fd6"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#fr-glow)"/>
  <!-- Cristal facetado (~88% de alto) -->
  <polygon points="64,8 92,40 64,120 36,40" fill="url(#fr-face-a)"/>
  <polygon points="64,8 92,40 64,120" fill="url(#fr-face-b)" opacity="0.85"/>
  <polygon points="36,40 92,40 64,56" fill="#ffffff" opacity="0.55"/>
  <polyline points="64,8 64,56 36,40" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.7"/>
  <polyline points="64,56 64,120" fill="none" stroke="#0e7490" stroke-width="1.4" opacity="0.5"/>
  <line x1="64" y1="56" x2="92" y2="40" stroke="#bdfaff" stroke-width="1.4" opacity="0.7"/>
  <!-- Destellos -->
  <path d="M100 26 L102 33 L109 35 L102 37 L100 44 L98 37 L91 35 L98 33 Z" fill="#ffffff"/>
  <circle cx="30" cy="86" r="2.4" fill="#eafdff"/>
